name: nexa-legacy

services:
  legacy-postgres:
    image: postgres:16-alpine
    container_name: nexa-legacy-postgres
    environment:
      POSTGRES_DB: ${NEXA_LEGACY_POSTGRES_DB:-nexa_platform_db}
      POSTGRES_USER: ${NEXA_LEGACY_POSTGRES_USER:-nexa}
      POSTGRES_PASSWORD: ${NEXA_POSTGRES_PASSWORD:?Set NEXA_POSTGRES_PASSWORD in api/.env.local}
    volumes:
      - nexa-legacy-postgres-data:/var/lib/postgresql/data
    networks:
      - legacy-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  legacy-api-asp:
    build:
      context: ../../../api-asp
      dockerfile: Dockerfile
    image: nexa/legacy-api-asp:local
    container_name: nexa-legacy-api-asp
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=legacy-postgres;Port=5432;Database=${NEXA_LEGACY_POSTGRES_DB:-nexa_platform_db};Username=${NEXA_LEGACY_POSTGRES_USER:-nexa};Password=${NEXA_POSTGRES_PASSWORD:?Set NEXA_POSTGRES_PASSWORD in api/.env.local};SSL Mode=Disable
      NEXA_JWT_SECRET: ${NEXA_SECURITY_JWT_SIGNING_KEY:?Set NEXA_SECURITY_JWT_SIGNING_KEY in api/.env.local}
      NEXA_JWT_ISSUER: nexa-platform
      NEXA_JWT_AUDIENCE: nexa-webapp
      APPLY_MIGRATIONS_ON_STARTUP: "true"
      SEED_DATA__ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
    depends_on:
      legacy-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5068:8080"
    networks:
      legacy-edge:
      legacy-data:
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20

  legacy-platform-vue:
    build:
      context: ../../../platform-vue
      dockerfile: Dockerfile
    image: nexa/legacy-platform-vue:local
    container_name: nexa-legacy-platform-vue
    depends_on:
      legacy-api-asp:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_DEV_PROXY_TARGET: http://legacy-api-asp:8080
      VITE_NEXA_API_BASE_URL: http://localhost:5068/api/v1
      VITE_SERVER_OPEN: "false"
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - legacy-edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 20

  legacy-portal-vue:
    build:
      context: ../../../portal-vue
      dockerfile: Dockerfile
    image: nexa/legacy-portal-vue:local
    container_name: nexa-legacy-portal-vue
    depends_on:
      legacy-api-asp:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    environment:
      VITE_DEV_PROXY_TARGET: http://legacy-api-asp:8080
      VITE_NEXA_API_BASE_URL: http://localhost:5068/api/v1
      VITE_SERVER_OPEN: "false"
    ports:
      - "127.0.0.1:5174:5174"
    networks:
      - legacy-edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 20

networks:
  legacy-edge:
    name: nexa-legacy-edge
  legacy-data:
    name: nexa-legacy-data
    internal: true

volumes:
  nexa-legacy-postgres-data:
    name: nexa-legacy-postgres-data
