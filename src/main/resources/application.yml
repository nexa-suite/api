spring:
  application:
    name: nexa-api
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  application:
    name: Nexa API
    status: foundation

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
