spring:
  application:
    name: nexa-api

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  application:
    name: Nexa API
    version: 0.1.0
    status: architecture-baseline
