spring:
  application:
    name: nexa-api
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${NEXA_DATABASE_URL:jdbc:postgresql://localhost:5432/nexa}
    username: ${NEXA_DATABASE_RUNTIME_USERNAME:${NEXA_DATABASE_USERNAME:nexa}}
    password: ${NEXA_DATABASE_RUNTIME_PASSWORD:${NEXA_DATABASE_PASSWORD:}}
    hikari:
      maximum-pool-size: ${NEXA_DATABASE_POOL_MAX:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${NEXA_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    db:
      enabled: true
    diskspace:
      enabled: true

info:
  application:
    name: Nexa API
    status: foundation

nexa:
  payments:
    provider: ${NEXA_PAYMENTS_PROVIDER:}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  object-storage:
    root: ${NEXA_OBJECT_STORAGE_ROOT:./.local-object-storage}
    endpoint: ${NEXA_OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${NEXA_OBJECT_STORAGE_BUCKET:nexa-private}
    access-key: ${NEXA_OBJECT_STORAGE_ACCESS_KEY:nexa-minio}
    secret-key: ${NEXA_OBJECT_STORAGE_SECRET_KEY:nexa-minio-local-foundation}
    region: ${NEXA_OBJECT_STORAGE_REGION:us-east-1}
    timeout-ms: ${NEXA_OBJECT_STORAGE_TIMEOUT_MS:5000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
