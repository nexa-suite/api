spring:
  config:
    activate:
      on-profile: local
  mail:
    host: ${NEXA_SMTP_HOST:}
    port: ${NEXA_SMTP_PORT:1025}
    username: ${NEXA_SMTP_USERNAME:}
    password: ${NEXA_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${NEXA_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${NEXA_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${NEXA_SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${NEXA_SMTP_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${NEXA_SMTP_WRITE_TIMEOUT_MS:5000}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  otlp:
    metrics:
      export:
        enabled: ${NEXA_OTEL_METRICS_ENABLED:false}

server:
  forward-headers-strategy: framework

nexa:
  clamav:
    mode: ${NEXA_CLAMAV_MODE:deterministic-local}
    host: ${NEXA_CLAMAV_HOST:}
    port: ${NEXA_CLAMAV_PORT:3310}
    connect-timeout-ms: ${NEXA_CLAMAV_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${NEXA_CLAMAV_READ_TIMEOUT_MS:10000}
  payments:
    provider: ${NEXA_PAYMENTS_PROVIDER:deterministic}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_local_service_foundation}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_local_foundation}
    api-base-url: ${NEXA_STRIPE_API_BASE_URL:}
    connect-timeout-ms: ${NEXA_STRIPE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${NEXA_STRIPE_READ_TIMEOUT_MS:10000}
    max-network-retries: ${NEXA_STRIPE_MAX_NETWORK_RETRIES:0}
    webhook-worker-delay-ms: ${NEXA_PAYMENT_WEBHOOK_WORKER_DELAY_MS:1000}
  documents:
    worker-delay-ms: ${NEXA_DOCUMENT_WORKER_DELAY_MS:3000}
  object-storage:
    root: ${NEXA_OBJECT_STORAGE_ROOT:./.local-object-storage}
    endpoint: ${NEXA_OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${NEXA_OBJECT_STORAGE_BUCKET:nexa-private}
    access-key: ${NEXA_OBJECT_STORAGE_ACCESS_KEY:nexa-minio}
    secret-key: ${NEXA_OBJECT_STORAGE_SECRET_KEY:nexa-minio-local-foundation}
    region: ${NEXA_OBJECT_STORAGE_REGION:us-east-1}
    timeout-ms: ${NEXA_OBJECT_STORAGE_TIMEOUT_MS:5000}
  security:
    issuer: ${NEXA_SECURITY_ISSUER:http://localhost:8080}
    audience: ${NEXA_SECURITY_AUDIENCE:nexa-local}
    access-token-ttl: ${NEXA_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${NEXA_REFRESH_TOKEN_TTL:P30D}
    rsa-public-key: ${NEXA_SECURITY_RSA_PUBLIC_KEY:./.local-keys/access-token-public.pem}
    rsa-private-key: ${NEXA_SECURITY_RSA_PRIVATE_KEY:./.local-keys/access-token-private.pem}
    allowed-origins: ${NEXA_SECURITY_ALLOWED_ORIGINS:${NEXA_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://localhost:8000,http://127.0.0.1:4200,http://127.0.0.1:4300,http://127.0.0.1:8000}}
    trusted-proxies: ${NEXA_TRUSTED_PROXIES:}
    refresh-cookie-secure: ${NEXA_REFRESH_COOKIE_SECURE:false}
    bcrypt-strength: ${NEXA_BCRYPT_STRENGTH:12}
    smtp:
      host: ${NEXA_SMTP_HOST:}
      port: ${NEXA_SMTP_PORT:1025}
      from: ${NEXA_SMTP_FROM:no-reply@nexa.local}
      timeout: ${NEXA_SMTP_TIMEOUT:PT5S}
      required: ${NEXA_SMTP_REQUIRED:false}
    reset:
      ttl: ${NEXA_PASSWORD_RESET_TTL:PT30M}
      platform-url: ${NEXA_PLATFORM_RESET_URL:http://localhost:4200/reset-password}
      portal-url: ${NEXA_PORTAL_RESET_URL:http://localhost:4300/reset-password}
      throttle-key: ${NEXA_PASSWORD_RESET_THROTTLE_KEY:}
    system-operator-token: ${NEXA_SYSTEM_OPERATOR_TOKEN:}
    notification-outbox-key: ${NEXA_NOTIFICATION_OUTBOX_KEY:}
    notification-outbox-key-version: ${NEXA_NOTIFICATION_OUTBOX_KEY_VERSION:v1}
    notification-outbox-previous-keys: ${NEXA_NOTIFICATION_OUTBOX_PREVIOUS_KEYS:}
    retention:
      reset-days: ${NEXA_SECURITY_RESET_RETENTION_DAYS:90}
      audit-days: ${NEXA_SECURITY_AUDIT_RETENTION_DAYS:365}
      batch-size: ${NEXA_SECURITY_RETENTION_BATCH_SIZE:200}
  dev-bootstrap:
    enabled: ${NEXA_DEV_BOOTSTRAP_ENABLED:false}
