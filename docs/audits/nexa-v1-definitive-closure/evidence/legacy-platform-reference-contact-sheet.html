<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexa Legacy Platform reference contact sheet</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; background: #eef2f6; color: #142033; }
    body { margin: 0; padding: 24px; }
    header { margin-bottom: 18px; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0; color: #52647b; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #ccd6e2; border-radius: 10px; background: white; box-shadow: 0 2px 8px rgb(20 32 51 / 8%); }
    img { display: block; width: 100%; height: 250px; object-fit: contain; background: #f8fafc; }
    figcaption { padding: 10px 12px; border-top: 1px solid #e5eaf0; font-size: 13px; font-weight: 650; }
  </style>
</head>
<body>
  <header><h1>Legacy/visual-bible Platform surfaces</h1><p>Contact sheet generated during Subtask 0 from the canonical screenshot archive.</p></header>
  <main>
    <figure><img src="/03-design/assets/screenshots/sales/sales-dashboard-current.png" alt="Sales dashboard"><figcaption>Sales Dashboard</figcaption></figure>

    <figure><img src="/03-design/assets/screenshots/logistics/logistics-dispatch-board-current.png" alt="Dispatch board"><figcaption>Dispatch Board</figcaption></figure>
    <figure><img src="/03-design/assets/screenshots/final-demo-path/07-logistics-dispatch-detail-created.png" alt="Dispatch detail"><figcaption>Dispatch Detail</figcaption></figure>
    <figure><img src="/03-design/assets/screenshots/owner/owner-company-administration-current.png" alt="Company administration"><figcaption>Company Administration</figcaption></figure>
    <figure><img src="/03-design/assets/screenshots/owner/owner-promotions-current.png" alt="Promotions"><figcaption>Promotions</figcaption></figure>
    <figure><img src="/03-design/assets/screenshots/responsive/profile-fullhd.png" alt="Profile"><figcaption>Profile</figcaption></figure>
