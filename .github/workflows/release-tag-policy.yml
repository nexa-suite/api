name: API Release Tag Policy

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Skip immutable pre-v0.14 legacy tags
        id: version-policy
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          major="${version%%.*}"
          minor_part="${version#*.}"
          minor="${minor_part%%.*}"
          if [[ "$major" == "0" && "$minor" -lt 14 ]]; then
            echo "legacy=true" >> "$GITHUB_OUTPUT"
            echo "Immutable pre-v0.14 tag: $RELEASE_TAG"
          else
            echo "legacy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify annotated SSH signature locally
        if: steps.version-policy.outputs.legacy != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git config --global gpg.format ssh
          git config --global gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-allowed-signers"
          git verify-tag "$RELEASE_TAG"
      - name: Verify GitHub signature status
        if: steps.version-policy.outputs.legacy != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_object_sha="$(git rev-parse "$RELEASE_TAG^{tag}")"
          verification="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
            | jq -r '[.verification.verified, .verification.reason] | @tsv')"
          test "$verification" = $'true\tvalid'
