name: API Release Tag Policy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing annotated release tag to verify"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release-tag:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Skip immutable pre-v0.14 legacy tags
        id: version-policy
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          major="${version%%.*}"
          minor_part="${version#*.}"
          minor="${minor_part%%.*}"
          if [[ "$major" == "0" && "$minor" -lt 14 ]]; then
            echo "legacy=true" >> "$GITHUB_OUTPUT"
            echo "Immutable pre-v0.14 tag: $RELEASE_TAG"
          else
            echo "legacy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify annotated SSH signature locally
        if: steps.version-policy.outputs.legacy != 'true'
        shell: bash
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          verification_ref="refs/tags/verified/$RELEASE_TAG"
          git fetch --no-tags --force origin "$tag_ref:$verification_ref"
          test "$(git cat-file -t "$verification_ref")" = tag
          git config --global gpg.format ssh
          git config --global gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-allowed-signers"
          git verify-tag -v "$verification_ref"
      - name: Verify GitHub signature status
        if: steps.version-policy.outputs.legacy != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          verification_ref="refs/tags/verified/$RELEASE_TAG"
          tag_object_sha="$(git rev-parse "${verification_ref}^{tag}")"
          verification="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
            | jq -r '[.verification.verified, .verification.reason] | @tsv')"
          test "$verification" = $'true\tvalid'
