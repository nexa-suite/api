name: API Supply Chain

on:
  pull_request:
  push:
    branches: [main, develop, "feature/**", "integration/**"]

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: anchore/sbom-action@v0.20.5
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp -DskipTests package
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nexa/api:supply-chain-${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nexa/api:supply-chain-${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/api-*.jar
