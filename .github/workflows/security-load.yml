name: API Security and Load

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "release/**", "integration/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minio-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build pinned rootless MinIO Community Edition
        run: docker build --tag nexa/minio-community:ci ops/compose/minio-community
      - name: Start MinIO with ephemeral credentials
        run: |
          set -euo pipefail
          root_user="ci$(openssl rand -hex 8)"
          root_password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$root_user"
          printf '::add-mask::%s\n' "$root_password"
          docker run --detach --rm --name nexa-minio-integration \
            --publish 127.0.0.1:9000:9000 \
            --env "MINIO_ROOT_USER=$root_user" \
            --env "MINIO_ROOT_PASSWORD=$root_password" \
            nexa/minio-community:ci server /data --console-address :9001
          {
            printf 'NEXA_MINIO_ROOT_USER=%s\n' "$root_user"
            printf 'NEXA_MINIO_ROOT_PASSWORD=%s\n' "$root_password"
          } >> "$GITHUB_ENV"
      - name: Wait for MinIO and create the private test bucket
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker exec nexa-minio-integration mc alias set local http://127.0.0.1:9000 \
              "$NEXA_MINIO_ROOT_USER" "$NEXA_MINIO_ROOT_PASSWORD" >/dev/null 2>&1 \
              && docker exec nexa-minio-integration mc mb --ignore-existing local/nexa-private >/dev/null 2>&1 \
              && docker exec nexa-minio-integration mc ready local >/dev/null 2>&1; then
              printf '%s\n' 'Rootless MinIO is ready with the private test bucket.'
              exit 0
            fi
            sleep 2
          done
          docker logs nexa-minio-integration
          exit 1
      - name: Verify the S3 adapter against MinIO
        env:
          NEXA_OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
          NEXA_OBJECT_STORAGE_BUCKET: nexa-private
        run: ./mvnw -B -ntp -Dtest=MinioObjectStorageIntegrationTests -Dnexa.minio.integration.enabled=true test
      - name: Stop MinIO
        if: ${{ always() }}
        run: docker stop nexa-minio-integration || true

  security-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Start API Compose runtime with MinIO and seed scoped Tenant fixtures
        run: ./ops/scripts/prepare-security-load-compose-fixture.sh
      - name: Run local security and abuse matrix
        run: ./scripts/verify-local-security.sh
      - name: Run authenticated OWASP ZAP role matrix
        env:
          ZAP_REPORT_DIR: zap-authenticated
        run: ./ops/security/zap-authenticated.sh
      - name: Run k6 service load smoke
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e BASE_URL="$BASE_URL" \
            -e NEXA_LOAD_WORKSPACE="$NEXA_LOAD_WORKSPACE" \
            -e NEXA_LOAD_EMAIL="$NEXA_LOAD_OWNER_EMAIL" \
            -e NEXA_LOAD_PASSWORD="$NEXA_LOAD_OWNER_PASSWORD" \
            -e K6_VUS=4 -e K6_DURATION=20s \
            -v "$GITHUB_WORKSPACE:/work" \
            grafana/k6:0.56.0 run --summary-export=/work/k6-summary.json /work/ops/load/k6/service-foundation.js
      - name: Run k6 business command matrix
        env:
          K6_BUSINESS_VUS: "4"
          K6_BUSINESS_DURATION: 20s
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e BASE_URL="$BASE_URL" \
            -e NEXA_LOAD_WORKSPACE="$NEXA_LOAD_WORKSPACE" \
            -e NEXA_LOAD_WAREHOUSE_IDS="$NEXA_LOAD_WAREHOUSE_IDS" \
            -e NEXA_LOAD_OWNER_EMAIL="$NEXA_LOAD_OWNER_EMAIL" \
            -e NEXA_LOAD_OWNER_PASSWORD="$NEXA_LOAD_OWNER_PASSWORD" \
            -e NEXA_LOAD_BUYER_EMAIL="$NEXA_LOAD_BUYER_EMAIL" \
            -e NEXA_LOAD_BUYER_PASSWORD="$NEXA_LOAD_BUYER_PASSWORD" \
            -e NEXA_LOAD_SALES_EMAIL="$NEXA_LOAD_SALES_EMAIL" \
            -e NEXA_LOAD_SALES_PASSWORD="$NEXA_LOAD_SALES_PASSWORD" \
            -e NEXA_LOAD_WAREHOUSE_EMAIL="$NEXA_LOAD_WAREHOUSE_EMAIL" \
            -e NEXA_LOAD_WAREHOUSE_PASSWORD="$NEXA_LOAD_WAREHOUSE_PASSWORD" \
            -e NEXA_LOAD_LOGISTICS_EMAIL="$NEXA_LOAD_LOGISTICS_EMAIL" \
            -e NEXA_LOAD_LOGISTICS_PASSWORD="$NEXA_LOAD_LOGISTICS_PASSWORD" \
            -e K6_BUSINESS_VUS="$K6_BUSINESS_VUS" \
            -e K6_BUSINESS_DURATION="$K6_BUSINESS_DURATION" \
            -v "$GITHUB_WORKSPACE:/work" \
            grafana/k6:0.56.0 run --summary-export=/work/k6-business-summary.json /work/ops/load/k6/business-foundation.js
      - name: Run OWASP ZAP API baseline
        run: |
          docker run --rm --network host --user 0 \
            -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            zaproxy/zap-stable:2.16.1 \
            zap-baseline.py -t "$BASE_URL/swagger-ui/index.html" -m 3 -I -r zap-report.html
      - name: Upload security and load evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-security-load-${{ github.run_id }}
          path: |
            k6-summary.json
            k6-business-summary.json
          if-no-files-found: ignore
      - name: Stop API Compose runtime
        if: ${{ always() && env.NEXA_SECURITY_LOAD_COMPOSE_STARTED == 'true' }}
        run: ./ops/compose/scripts/modern-down.sh
