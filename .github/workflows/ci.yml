name: API CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "integration/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify API with real PostgreSQL integrations
        run: ./mvnw clean verify -Dnexa.integration.enabled=true
