name: API CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "release/**", "integration/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Fetch published v2.0.0 consumer baseline
        run: git fetch --no-tags --depth=1 origin refs/tags/v2.0.0:refs/tags/v2.0.0
      - name: Fetch published v0.17.1 migration baseline
        run: git fetch --no-tags --depth=1 origin refs/tags/v0.17.1:refs/tags/v0.17.1
      - name: Fetch published v0.18.0 consumer baseline
        run: git fetch --no-tags --depth=1 origin refs/tags/v0.18.0:refs/tags/v0.18.0
      - name: Fetch latest published v0.19.0 consumer baseline
        run: git fetch --no-tags --depth=1 origin refs/tags/v0.19.0:refs/tags/v0.19.0
      - name: Fetch latest published v0.21.0 consumer baseline
        run: git fetch --no-tags --depth=1 origin refs/tags/v0.21.0:refs/tags/v0.21.0
      - name: Fetch previous published v0.20.0 consumer baseline
        run: git fetch --no-tags --depth=1 origin refs/tags/v0.20.0:refs/tags/v0.20.0
      - name: Fetch immutable migration baseline 689be612
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch --no-tags --depth=1 origin 689be612d96079feb02a155fbe76d829a10bdeb1
      - name: Fetch immutable migration baseline acbb76f5
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch --no-tags --depth=1 origin acbb76f56deba09fcb0ee31ea6854238dcb7486b
      - name: Verify OpenAPI compatibility against base snapshot
        if: ${{ github.event_name == 'pull_request' }}
        env:
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$OPENAPI_BASE_REF"
          python3 .github/scripts/test_check_openapi_compatibility.py
          python3 .github/scripts/test_check_openapi_migration.py
          python3 .github/scripts/check-openapi-migration.py
      - name: Verify OpenAPI compatibility against published v2.0.0
        if: ${{ github.event_name == 'pull_request' }}
        env:
          OPENAPI_BASE_REF: v2.0.0
        run: python3 .github/scripts/check-openapi-migration.py
      - name: Verify OpenAPI compatibility against historical v0.21.0 release
        if: ${{ github.event_name == 'pull_request' }}
        env:
          OPENAPI_BASE_REF: v0.21.0
        run: python3 .github/scripts/check-openapi-migration.py
      - name: Verify OpenAPI compatibility against previous published release
        if: ${{ github.event_name == 'pull_request' }}
        env:
          OPENAPI_BASE_REF: v0.20.0
        run: python3 .github/scripts/check-openapi-migration.py
      - name: Verify OpenAPI compatibility against previous consumer release
        if: ${{ github.event_name == 'pull_request' }}
        env:
          OPENAPI_BASE_REF: v0.19.0
        run: python3 .github/scripts/check-openapi-migration.py
      - name: Verify OpenAPI compatibility against earlier consumer release
        if: ${{ github.event_name == 'pull_request' }}
        env:
          OPENAPI_BASE_REF: v0.18.0
        run: python3 .github/scripts/check-openapi-migration.py
      - name: Verify OpenAPI compatibility against historical upgrade baseline
        if: ${{ github.event_name == 'pull_request' }}
        env:
          OPENAPI_BASE_REF: v0.17.1
        run: python3 .github/scripts/check-openapi-migration.py
      - name: Verify disposable provisioning fixtures before the full suite
        run: |
          echo 'Runner ephemeral port range:'
          cat /proc/sys/net/ipv4/ip_local_port_range
          ./mvnw -B -ntp -Dtest=LocalTenantBusinessDatabaseProvisioningE2EIT \
            -Dnexa.integration.enabled=true test
      - name: Start external integration adapters
        run: |
          docker run -d --name nexa-ci-clamav -p 3310:3310 clamav/clamav-debian:1.4.3
          docker run -d --name nexa-ci-stripe-mock -p 12111:8080 \
            -v "$GITHUB_WORKSPACE/ops/compose/stripe-mock/mappings:/home/wiremock/mappings:ro" \
            wiremock/wiremock:3.13.1 --global-response-templating
          adapters_ready=0
          for _ in $(seq 1 60); do
            stripe_ready=0
            clamav_ready=0
            curl --fail --silent http://127.0.0.1:12111/__admin/health >/dev/null && stripe_ready=1 || true
            docker exec nexa-ci-clamav clamdscan --ping 1 >/dev/null 2>&1 && clamav_ready=1 || true
            if [ "$stripe_ready" -eq 1 ] && [ "$clamav_ready" -eq 1 ]; then
              adapters_ready=1
              break
            fi
            sleep 2
          done
          if [ "$adapters_ready" -ne 1 ]; then
            echo "External integration adapters did not become ready in time"
            exit 1
          fi
          docker logs nexa-ci-clamav
          docker logs nexa-ci-stripe-mock
      - name: Verify dispatch Sales authorization fixture before the full suite
        env:
          NEXA_DATABASE_POOL_MAX: "4"
          NEXA_CLAMAV_MODE: network
          NEXA_CLAMAV_HOST: 127.0.0.1
          NEXA_CLAMAV_PORT: "3310"
        run: >-
          ./mvnw -B -ntp -Dtest='DispatchLifecycleIT#salesDispatchReadsFollowActiveAccountAssignment'
          -Dnexa.integration.enabled=true
          -Dnexa.scheduling.enabled=false
          -Dspring.modulith.moments.enabled=false
          -Dspring.datasource.hikari.maximum-pool-size=4 test
      - name: Verify API with real PostgreSQL integrations
        id: verify
        env:
          NEXA_DATABASE_POOL_MAX: "4"
          NEXA_CLAMAV_MODE: network
          NEXA_CLAMAV_HOST: 127.0.0.1
          NEXA_CLAMAV_PORT: "3310"
        run: >-
          ./mvnw clean verify -Dnexa.integration.enabled=true
          -Dnexa.scheduling.enabled=false
          -Dspring.modulith.moments.enabled=false
          -Dspring.datasource.hikari.maximum-pool-size=4
      - name: Export OpenAPI diagnostic candidate
        id: openapi_snapshot
        if: ${{ failure() && steps.verify.outcome == 'failure' && github.event_name == 'pull_request' }}
        env:
          NEXA_DATABASE_POOL_MAX: "4"
          NEXA_CLAMAV_MODE: network
          NEXA_CLAMAV_HOST: 127.0.0.1
          NEXA_CLAMAV_PORT: "3310"
        run: >-
          ./mvnw -B -ntp -Dtest=OpenApiContractIT
          -Dnexa.integration.enabled=true -Dnexa.openapi.write-snapshot=true
          -Dnexa.scheduling.enabled=false
          -Dspring.modulith.moments.enabled=false
          -Dspring.datasource.hikari.maximum-pool-size=4 test
      - name: Upload OpenAPI diagnostic candidate
        if: ${{ always() && steps.openapi_snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-candidate-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: docs/openapi/openapi.json
          if-no-files-found: error
          retention-days: 3
      - name: Stop external integration adapters
        if: ${{ always() }}
        run: docker rm -f nexa-ci-clamav nexa-ci-stripe-mock || true
