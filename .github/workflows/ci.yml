name: API CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "integration/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify API with real PostgreSQL integrations
        env:
          NEXA_DATABASE_POOL_MAX: "32"
        run: ./mvnw clean verify -Dnexa.integration.enabled=true
