name: API CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "integration/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Start external integration adapters
        env:
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password-2026!
        run: |
          docker run -d --name nexa-ci-clamav -p 3310:3310 clamav/clamav-debian:1.4.3
          docker run -d --name nexa-ci-stripe-mock -p 12111:8080 \
            -v "$GITHUB_WORKSPACE/ops/compose/stripe-mock/mappings:/home/wiremock/mappings:ro" \
            wiremock/wiremock:3.13.1 --global-response-templating
          docker run -d --name nexa-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            minio/minio:RELEASE.2024-10-13T13-34-11Z server /data
          adapters_ready=0
          for _ in $(seq 1 60); do
            stripe_ready=0
            clamav_ready=0
            minio_ready=0
            curl --fail --silent http://127.0.0.1:12111/__admin/health >/dev/null && stripe_ready=1 || true
            docker exec nexa-ci-clamav clamdscan --ping 1 >/dev/null 2>&1 && clamav_ready=1 || true
            curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null && minio_ready=1 || true
            if [ "$stripe_ready" -eq 1 ] && [ "$clamav_ready" -eq 1 ] && [ "$minio_ready" -eq 1 ]; then
              adapters_ready=1
              break
            fi
            sleep 2
          done
          if [ "$adapters_ready" -ne 1 ]; then
            echo "External integration adapters did not become ready in time"
            exit 1
          fi
          docker volume create nexa-ci-minio-config >/dev/null
          docker run --rm --network host -v nexa-ci-minio-config:/root/.mc \
            minio/mc:RELEASE.2024-10-08T09-37-26Z \
            alias set ci http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          docker run --rm --network host -v nexa-ci-minio-config:/root/.mc \
            minio/mc:RELEASE.2024-10-08T09-37-26Z \
            mb --ignore-existing ci/nexa-private
          docker logs nexa-ci-clamav
          docker logs nexa-ci-stripe-mock
          docker logs nexa-ci-minio
      - name: Verify API with real PostgreSQL integrations
        env:
          NEXA_DATABASE_POOL_MAX: "32"
          NEXA_CLAMAV_MODE: network
          NEXA_CLAMAV_HOST: 127.0.0.1
          NEXA_CLAMAV_PORT: "3310"
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password-2026!
        run: >-
          ./mvnw clean verify -Dnexa.integration.enabled=true
          -Dspring.datasource.hikari.maximum-pool-size=32
          -Dnexa.object-storage.endpoint=http://127.0.0.1:9000
          -Dnexa.object-storage.bucket=nexa-private
          -Dnexa.object-storage.access-key="$MINIO_ROOT_USER"
          -Dnexa.object-storage.secret-key="$MINIO_ROOT_PASSWORD"
          -Dnexa.object-storage.region=us-east-1
      - name: Verify OpenAPI compatibility against base snapshot
        if: ${{ github.event_name == 'pull_request' }}
        env:
          OPENAPI_BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 .github/scripts/test_check_openapi_compatibility.py
          python3 .github/scripts/check-openapi-compatibility.py
      - name: Stop external integration adapters
        if: ${{ always() }}
        run: docker rm -f nexa-ci-clamav nexa-ci-stripe-mock nexa-ci-minio || true; docker volume rm nexa-ci-minio-config || true
